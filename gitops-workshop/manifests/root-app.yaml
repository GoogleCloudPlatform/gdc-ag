apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gitops-platform
    gitops.platform/group: gitops-platform
    gitops.platform/project: manifests
    gitops.platform/tier: root
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: gitops-platform
  source:
    repoURL: git@gitlab-omnibus.gitlab.svc.cluster.local:gitops-platform/manifests.git
    targetRevision: HEAD
    path: manifests/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
