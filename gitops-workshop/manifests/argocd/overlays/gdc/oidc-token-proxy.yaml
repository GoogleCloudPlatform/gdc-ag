---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-token-proxy-cm
  namespace: argocd
data:
  proxy.py: |
    import json, ssl, socket, sys, traceback
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from socketserver import ThreadingMixIn

    REAL_IP = "10.200.20.4"
    UPSTREAM_HOST = "fake-oidc-provider.org-1.zone1.google.gdch.test"

    def forward_upstream(method, path, headers_dict, body_bytes):
        ctx = ssl.create_default_context()
        ctx.check_hostname = False
        ctx.verify_mode = ssl.CERT_NONE

        s = socket.create_connection((REAL_IP, 443))
        ss = ctx.wrap_socket(s, server_hostname=UPSTREAM_HOST)

        req_headers = [f"{method} {path} HTTP/1.1", f"Host: {UPSTREAM_HOST}"]
        for k, v in headers_dict.items():
            if k.lower() not in ['host', 'accept-encoding', 'connection', 'content-length']:
                req_headers.append(f"{k}: {v}")
        if body_bytes:
            req_headers.append(f"Content-Length: {len(body_bytes)}")
        else:
            req_headers.append("Content-Length: 0")
        req_headers.append("Connection: close")

        req_raw = "\r\n".join(req_headers).encode('utf-8') + b"\r\n\r\n"
        if body_bytes:
            req_raw += body_bytes

        ss.sendall(req_raw)

        resp_data = b""
        while True:
            chunk = ss.recv(8192)
            if not chunk:
                break
            resp_data += chunk
        ss.close()

        header_end = resp_data.find(b"\r\n\r\n")
        if header_end == -1:
            return 500, {}, resp_data

        header_bytes = resp_data[:header_end].decode('utf-8', errors='ignore')
        body_payload = resp_data[header_end + 4:]

        lines = header_bytes.split("\r\n")
        status_code = int(lines[0].split(" ")[1])

        resp_headers = {}
        for line in lines[1:]:
            if ":" in line:
                k, v = line.split(":", 1)
                resp_headers[k.strip()] = v.strip()

        return status_code, resp_headers, body_payload

    class ThreadedHTTPServer(ThreadingMixIn, HTTPServer):
        daemon_threads = True

    class ProxyHandler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            print(f"PROXY LOG: {format % args}", flush=True)

        def do_GET(self):
            self.handle_proxy()

        def do_POST(self):
            self.handle_proxy()

        def do_HEAD(self):
            self.handle_proxy()

        def handle_proxy(self):
            try:
                if self.path.startswith("/userinfo"):
                    auth_header = self.headers.get('Authorization', '')
                    token = auth_header.replace("Bearer ", "").strip() if "Bearer " in auth_header else ""
                    claims = {}
                    if token:
                        try:
                            import base64
                            parts = token.split(".")
                            if len(parts) >= 2:
                                b64 = parts[1] + "=" * (-len(parts[1]) % 4)
                                claims = json.loads(base64.urlsafe_b64decode(b64).decode('utf-8'))
                        except Exception as e:
                            print(f"Error decoding userinfo token: {e}", flush=True)

                    email = claims.get("email", "workshop-user@gdch.test")
                    sub = claims.get("sub", email)
                    name = claims.get("name") or claims.get("preferred_username") or email.split("@")[0]
                    preferred_username = claims.get("preferred_username") or email.split("@")[0]

                    userinfo = {
                        "sub": sub,
                        "email": email,
                        "email_verified": True,
                        "name": name,
                        "preferred_username": preferred_username
                    }
                    resp_data = json.dumps(userinfo).encode('utf-8')
                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.send_header('Content-Length', str(len(resp_data)))
                    self.end_headers()
                    if self.command != "HEAD":
                        self.wfile.write(resp_data)
                    print(f"Served /userinfo for {email}!", flush=True)
                    return

                length = int(self.headers.get('Content-Length', 0))
                body = self.rfile.read(length) if length > 0 else None

                headers_dict = {k: v for k, v in self.headers.items()}

                status, resp_headers, resp_data = forward_upstream(self.command, self.path, headers_dict, body)

                if "/.well-known/openid-configuration" in self.path:
                    try:
                        data = json.loads(resp_data.decode('utf-8'))
                        data["userinfo_endpoint"] = f"https://{UPSTREAM_HOST}/userinfo"
                        resp_data = json.dumps(data).encode('utf-8')
                        print("Injected userinfo_endpoint into openid-configuration!", flush=True)
                    except Exception as e:
                        print(f"Error modifying openid-configuration: {e}", flush=True)

                if "/token" in self.path:
                    try:
                        data = json.loads(resp_data.decode('utf-8'))
                        if "id_token" in data and "access_token" not in data:
                            id_tok = data.get("id_token", "")
                            mod_data = {
                                "access_token": id_tok,
                                "token_type": "Bearer",
                                "id_token": id_tok,
                                "expires_in": 3600
                            }
                            resp_data = json.dumps(mod_data).encode('utf-8')
                            print("Injected access_token into /token response!", flush=True)
                    except Exception as e:
                        print(f"Error modifying token response: {e}", flush=True)

                self.send_response(status)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(resp_data)))
                self.end_headers()
                if self.command != "HEAD":
                    self.wfile.write(resp_data)
            except Exception as e:
                print(f"EXCEPT IN HANDLE_PROXY: {e}", flush=True)
                traceback.print_exc()
                try:
                    self.send_error(500, str(e))
                except Exception:
                    pass

    if __name__ == '__main__':
        server = ThreadedHTTPServer(('0.0.0.0', 8443), ProxyHandler)
        ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
        ctx.load_cert_chain(certfile="/tls/tls.crt", keyfile="/tls/tls.key")
        server.socket = ctx.wrap_socket(server.socket, server_side=True)
        print(f"OIDC Token Normalizer TLS Proxy listening on 0.0.0.0:8443 for {UPSTREAM_HOST}...", flush=True)
        server.serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-token-proxy
  namespace: argocd
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 8443
  selector:
    app: oidc-token-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-token-proxy
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-token-proxy
  template:
    metadata:
      labels:
        app: oidc-token-proxy
    spec:
      containers:
      - name: proxy
        image: user-haas-instance-user-project.org-1.zone1.google.gdch.test/project-lowhigh/python:3.11-alpine
        command:
        - python3
        - /app/proxy.py
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8443
        volumeMounts:
        - mountPath: /app
          name: script
        - mountPath: /tls
          name: tls
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: oidc-token-proxy-cm
      - name: tls
        secret:
          secretName: oidc-token-proxy-tls

