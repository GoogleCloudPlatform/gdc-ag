    iam.private.gdc.goog/owner-operable-component: MKS
    user-roles.system.private.gdc.goog/hierarchy-level: project
    user-roles.system.private.gdc.goog/persona: app-operator
    user-roles.system.private.gdc.goog/type: predefined
  name: admin-cluster-admin
spec:
  roleRef:
    apiGroup: iam.gdc.goog
    kind: StandardClusterRole
    name: cluster-admin
  subjects:
