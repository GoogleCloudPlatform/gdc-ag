projects:
- name: sample-project-1
  orgId: org-1
  description: This is a sample project for the workshop
  users:
    - user: platform-admin@example.com
      roleSetRef: roleSets/developer
    - user: user@example.com
      roleSetRef: roleSets/developer
- name: user-project
  users:
    - user: platform-admin@example.com
      roleSetRef: roleSets/developer
    - user: user@example.com
      roleSetRef: roleSets/harborUser
roleSets:
  developer:
    roles:
      - ai-ocr-developer
      - ai-translation-developer
      - harbor-instance-admin
      - harbor-instance-viewer
      - kms-admin
      - project-iam-admin
      - project-networkpolicy-admin
      - secret-admin
      - workbench-notebooks-admin
      - k8s-networkpolicy-admin
      - namespace-admin

      - project-viewer
      - vertex-ai-prediction-user
      - project-grafana-viewer
      - project-db-admin
      - project-vm-admin
      - project-vm-image-admin
    orgRoles:
      - ai-platform-admin
  viewer:
    roles:
      - project-viewer
  harborUser:
    roles:
      - project-viewer
      - harbor-instance-viewer
      - harbor-instance-admin

