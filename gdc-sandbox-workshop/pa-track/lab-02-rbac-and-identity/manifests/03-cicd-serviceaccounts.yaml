---
# ==============================================================================
# Pipeline 1: GitLab CI/CD Deployer ServiceAccount (finance-dev)
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-deployer-sa
  namespace: finance-dev
  labels:
    gdc.google.com/pipeline: gitlab-ci
    app.kubernetes.io/managed-by: gdc-platform-admin

---
# Declarative ServiceAccount Token Secret (K8s 1.24+ standard)
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-deployer-sa-token
  namespace: finance-dev
  annotations:
    kubernetes.io/service-account.name: gitlab-deployer-sa
  labels:
    gdc.google.com/pipeline: gitlab-ci
type: kubernetes.io/service-account-token

---
# Scoped RoleBinding: Grants CI/CD Deployer role exclusively within finance-dev
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-deployer-finance-dev-binding
  namespace: finance-dev
  labels:
    gdc.google.com/pipeline: gitlab-ci
subjects:
  - kind: ServiceAccount
    name: gitlab-deployer-sa
    namespace: finance-dev
roleRef:
  kind: ClusterRole
  name: gdc-cicd-deployer-role
  apiGroup: rbac.authorization.k8s.io

---
# ==============================================================================
# Pipeline 2: GitLab CI/CD Deployer ServiceAccount (finance-prod)
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-deployer-sa
  namespace: finance-prod
  labels:
    gdc.google.com/pipeline: gitlab-ci
    app.kubernetes.io/managed-by: gdc-platform-admin

---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-deployer-sa-token
  namespace: finance-prod
  annotations:
    kubernetes.io/service-account.name: gitlab-deployer-sa
  labels:
    gdc.google.com/pipeline: gitlab-ci
type: kubernetes.io/service-account-token

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-deployer-finance-prod-binding
  namespace: finance-prod
  labels:
    gdc.google.com/pipeline: gitlab-ci
subjects:
  - kind: ServiceAccount
    name: gitlab-deployer-sa
    namespace: finance-prod
roleRef:
  kind: ClusterRole
  name: gdc-cicd-deployer-role
  apiGroup: rbac.authorization.k8s.io

---
# ==============================================================================
# Pipeline 3: Jenkins Analytics Runner ServiceAccount (analytics-lab)
# ==============================================================================
