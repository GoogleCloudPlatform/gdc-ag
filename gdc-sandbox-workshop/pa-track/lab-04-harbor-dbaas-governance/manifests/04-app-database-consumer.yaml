# Tenant Workload Consuming Managed DBaaS PostgreSQL / AlloyDB Omni
# Conforms to enterprise policy guardrails with secure secret injection

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processing-service
  namespace: sample-project-1
  labels:
    app: order-processor
    tier: backend
    gdc.goog/consumes-db: tenant-order-db
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-processor
  template:
    metadata:
      labels:
        app: order-processor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Init Container: Ensures database connectivity before application starts
      initContainers:
        - name: wait-for-db
          image: harbor.zone1.google.gdch.test/sample-project-1/busybox:latest
          command:
            - "sh"
            - "-c"
            - |
              echo "Waiting for database endpoint ${DB_HOST}:${DB_PORT}..."
              until nc -z -v -w5 "${DB_HOST}" "${DB_PORT}"; do
                echo "Database not reachable yet. Retrying in 3s..."
                sleep 3
              done
              echo "Database endpoint reachable."
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: host
                  optional: true
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: port
                  optional: true
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      # Main Application Container
      containers:
        - name: order-processor
          image: harbor.zone1.google.gdch.test/sample-project-1/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-db-credentials
                  key: password
            - name: DB_SSLMODE
              value: "require"
            - name: CONNECTION_POOL_MAX
              value: "20"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-processing-service
  namespace: sample-project-1
  labels:
    app: order-processor
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: order-processor
