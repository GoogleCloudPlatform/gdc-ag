# Managed Database as a Service (DBaaS) - PostgreSQL / AlloyDB Omni Cluster
# Custom Resource for GDC Air-Gapped Tenant Workloads

apiVersion: db.gdc.goog/v1
kind: DatabaseCluster
metadata:
  name: tenant-order-db
  namespace: sample-project-1
  labels:
    app.kubernetes.io/name: tenant-order-db
    app.kubernetes.io/part-of: order-management-system
    gdc.goog/tier: production
    gdc.goog/engine: postgresql
spec:
  # Database Engine Specification
  engine:
    type: postgresql
    version: "15.4"
    edition: enterprise # AlloyDB Omni / Enterprise Postgres

  # Topology & High Availability
  topology:
    instances: 2 # 1 Primary + 1 Synchronous Standby with automated failover
    antiAffinity: true

  # Compute & Resource Sizing (Conforms to Policy Guardrails)
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  # Persistent Storage Configuration
  storage:
    storageClassName: standard-rwo
    size: 50Gi
    autoExpand: true
    maxSize: 200Gi

  # Automated Credential & Connection Secret Generation
  credentials:
    secretName: tenant-db-credentials
    databaseName: orderdb
    adminUsername: app_admin
    autoGeneratePassword: true

  # Network & Encryption Policies
  security:
    enableTls: true
    enforceSsl: true
    networkPolicy:
      allowTenantNamespaceOnly: true

  # Database Engine Parameters
  parameters:
    max_connections: "150"
    shared_buffers: "512MB"
    work_mem: "16MB"
    maintenance_work_mem: "128MB"
    checkpoint_completion_target: "0.9"
    wal_buffers: "16MB"
    default_statistics_target: "100"
