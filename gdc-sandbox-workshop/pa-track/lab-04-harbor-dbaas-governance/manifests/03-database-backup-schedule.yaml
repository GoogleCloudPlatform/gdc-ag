# Automated Database Backup Policy and Retention Schedule for GDC Air-Gapped DBaaS

apiVersion: db.gdc.goog/v1
kind: DatabaseBackupSchedule
metadata:
  name: tenant-order-db-daily-backup
  namespace: sample-project-1
  labels:
    app.kubernetes.io/name: tenant-order-db
    backup.gdc.goog/schedule-tier: gold
spec:
  # Target Database Reference
  clusterRef:
    name: tenant-order-db
    kind: DatabaseCluster

  # Cron Expression (Daily at 02:00 AM UTC during maintenance window)
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  suspended: false

  # Backup Retention & Lifecycle Policy
  retention:
    keepCount: 30 # Retain last 30 daily snapshots
    retentionPeriod: "30d"

  # Backup Scope & Point-in-Time Recovery (PITR)
  backupConfig:
    type: FullWithWalArchiving
    enablePointInTimeRecovery: true
    walRetentionDays: 7

  # Target Air-Gapped Object Storage Destination
  storage:
    type: GdcObjectStorage
    bucketName: "gdc-tenant-backups-sample-project-1"
    storageClass: STANDARD
