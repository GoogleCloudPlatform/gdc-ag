# NON-COMPLIANT WORKLOAD: Demonstrates multiple policy violations:
# 1. Disallowed container privileged mode (privileged: true)
# 2. Disallowed Linux capability (SYS_ADMIN)
# 3. Disallowed hostPath volume mount (/var/run/docker.sock)
# 4. Missing CPU and Memory requests and limits

apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged-pod
  namespace: sample-project-1
  labels:
    app: security-test
    compliance: non-compliant
spec:
  containers:
    - name: privileged-container
      image: harbor.zone1.google.gdch.test/sample-project-1/busybox:latest
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        capabilities:
          add:
            - SYS_ADMIN
      volumeMounts:
        - name: host-docker-sock
          mountPath: /var/run/docker.sock
  volumes:
    - name: host-docker-sock
      hostPath:
        path: /var/run/docker.sock
        type: Socket
