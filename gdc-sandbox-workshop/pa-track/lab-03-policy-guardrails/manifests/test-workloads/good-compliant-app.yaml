# COMPLIANT WORKLOAD: Fully conforms to all GDC Air-Gapped enterprise guardrails:
# 1. Image originates from internal Harbor registry (harbor.zone1.google.gdch.test/*)
# 2. Runs as non-root user (10001) with unprivileged mode and dropped capabilities
# 3. No hostPath volume mounts (uses emptyDir for writable scratch space)
# 4. Explicit CPU and Memory requests and limits defined

apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-frontend-app
  namespace: sample-project-1
  labels:
    app: secure-frontend
    compliance: compliant
    tier: presentation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-frontend
  template:
    metadata:
      labels:
        app: secure-frontend
        compliance: compliant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-server
          image: harbor.zone1.google.gdch.test/sample-project-1/web-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: secure-frontend-app
  namespace: sample-project-1
  labels:
    app: secure-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: secure-frontend
