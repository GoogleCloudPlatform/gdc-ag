---
# ==============================================================================
# Tier 1 LimitRange: Standard Development (finance-dev)
# Purpose: Auto-inject sensible defaults so developer pods without resource specs
#          do not monopolize the namespace or fail admission.
# ==============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: finance-dev-limits
  namespace: finance-dev
  labels:
    gdc.google.com/tier: standard-dev
    app.kubernetes.io/managed-by: gdc-platform-admin
spec:
  limits:
  - type: Container
    default:
      cpu: "1"
      memory: 2Gi
    defaultRequest:
      cpu: 250m
      memory: 512Mi
    min:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "4"
      memory: 8Gi
    maxLimitRequestRatio:
      cpu: "4"
      memory: "4"
  - type: PersistentVolumeClaim
    min:
      storage: 1Gi
    max:
      storage: 25Gi

---
# ==============================================================================
# Tier 2 LimitRange: Mission-Critical Production (finance-prod)
# Purpose: Enforce higher baseline guarantees and bounded bursting for production
# ==============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: finance-prod-limits
  namespace: finance-prod
  labels:
    gdc.google.com/tier: mission-critical-prod
    app.kubernetes.io/managed-by: gdc-platform-admin
spec:
  limits:
  - type: Container
    default:
      cpu: "2"
      memory: 4Gi
    defaultRequest:
      cpu: 500m
      memory: 1Gi
    min:
      cpu: 200m
      memory: 256Mi
    max:
      cpu: "8"
      memory: 16Gi
    maxLimitRequestRatio:
      cpu: "4"
      memory: "4"
  - type: PersistentVolumeClaim
    min:
      storage: 5Gi
    max:
      storage: 100Gi

---
# ==============================================================================
# Tier 3 LimitRange: GPU Analytics & AI Lab (analytics-lab)
# Purpose: Provide baseline sizing for large data transformations and ML models
# ==============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: analytics-lab-limits
  namespace: analytics-lab
  labels:
    gdc.google.com/tier: gpu-analytics
    app.kubernetes.io/managed-by: gdc-platform-admin
spec:
  limits:
  - type: Container
    default:
      cpu: "8"
      memory: 16Gi
    defaultRequest:
      cpu: "1"
      memory: 4Gi
    min:
      cpu: 500m
      memory: 1Gi
    max:
      cpu: "16"
      memory: 32Gi
      nvidia.com/gpu: "2"
  - type: PersistentVolumeClaim
    min:
      storage: 10Gi
    max:
      storage: 200Gi
