---
# Baseline Zero-Trust Default Deny NetworkPolicy
# Applied to tenant namespaces to isolate workloads by default.
# Blocks all ingress and egress traffic except for essential platform DNS resolution (UDP/TCP port 53).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-traffic
  labels:
    gdc.google.com/security-tier: baseline
    gdc.google.com/policy-type: zero-trust-default-deny
spec:
  podSelector: {} # Selects all pods in the namespace
  policyTypes:
    - Ingress
    - Egress
  # Empty ingress list = deny all ingress from all sources
  ingress: []
  # Egress explicitly permits DNS resolution so workloads can discover services
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow communication to cluster local CoreDNS fallback
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: coredns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
