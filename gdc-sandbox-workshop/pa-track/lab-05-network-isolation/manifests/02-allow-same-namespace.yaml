---
# Intra-Namespace Communication Policy
# Allows all pods inside the same tenant namespace to communicate freely with one another.
# Enforces tenant boundary isolation while enabling internal microservice interaction.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  labels:
    gdc.google.com/security-tier: tenant-internal
    gdc.google.com/policy-type: allow-intra-namespace
spec:
  podSelector: {} # Applies to all pods in the target namespace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from any pod within this identical namespace
    - from:
        - podSelector: {}
  egress:
    # Allow egress to any pod within this identical namespace
    - to:
        - podSelector: {}
