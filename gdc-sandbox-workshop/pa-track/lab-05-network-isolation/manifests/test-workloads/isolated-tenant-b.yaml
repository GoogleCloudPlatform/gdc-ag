---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b
  labels:
    kubernetes.io/metadata.name: tenant-b
    gdc.google.com/tenant-id: tenant-b
    gdc.google.com/tier: tenant-workloads

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-b
  namespace: tenant-b
  labels:
    app: client-b
    tenant: tenant-b
    tier: isolated
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-b
  template:
    metadata:
      labels:
        app: client-b
        tenant: tenant-b
        tier: isolated
    spec:
      containers:
        - name: probe
          image: harbor.zone1.google.gdch.test/library/curl:8.5.0
          command:
            - "/bin/sh"
            - "-c"
            - "while true; do sleep 3600; done"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: client-b
  namespace: tenant-b
  labels:
    app: client-b
    tenant: tenant-b
spec:
  type: ClusterIP
  selector:
    app: client-b
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
