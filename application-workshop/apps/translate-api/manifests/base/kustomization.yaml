apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: translate-api

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: translate-api-config
    envs:
      - app.properties

secretGenerator:
  - name: translate-api-secrets
    envs:
      - app-secrets.properties

replacements:
  - source:
      kind: ConfigMap
      name: translate-api-config
      fieldPath: data.IMAGE_FRONTEND
    targets:
      - select:
          kind: Deployment
          name: translate-api
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: translate-api-config
      fieldPath: data.IMAGE_API
    targets:
      - select:
          kind: Deployment
          name: translate-api
        fieldPaths:
          - spec.template.spec.containers.1.image
