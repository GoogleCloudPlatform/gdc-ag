apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: upload-api

resources:
  - stateful-set.yaml
  - service.yaml
  - role-binding.yaml

configMapGenerator:
  - name: upload-api-config
    envs:
      - app.properties

secretGenerator:
  - name: upload-api-secrets
    envs:
      - app-secrets.properties

replacements:
  - source:
      kind: ConfigMap
      name: upload-api-config
      fieldPath: data.IMAGE
    targets:
      - select:
          kind: StatefulSet
          name: upload-api
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: upload-api-config
      fieldPath: data.BUCKET_NAME
    targets:
      - select:
          kind: StatefulSet
          name: upload-api
        fieldPaths:
          - spec.template.spec.containers.0.env.1.value
  - source:
      kind: ConfigMap
      name: upload-api-config
      fieldPath: data.STORAGE_ENDPOINT
    targets:
      - select:
          kind: StatefulSet
          name: upload-api
        fieldPaths:
          - spec.template.spec.containers.0.env.2.value
  - source:
      kind: ConfigMap
      name: upload-api-config
      fieldPath: data.PLATFORM_ADMIN
    targets:
      - select:
          kind: RoleBinding
          name: readwrite-all-buckets
        fieldPaths:
          - subjects.0.name
