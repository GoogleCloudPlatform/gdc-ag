apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: upload-api
  labels:
    app: upload-api
spec:
  serviceName: upload-api
  replicas: 1
  selector:
    matchLabels:
      app: upload-api
  template:
    metadata:
      labels:
        app: upload-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: upload-api
          image: imagenameplaceholder
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /uploads
          env:
            - name: UPLOAD_FOLDER
              value: /uploads
            - name: BUCKET_NAME
              value: bucketnameplaceholder
            - name: STORAGE_ENDPOINT
              value: storageplaceholder
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: upload-api-secrets
                  key: SECRET_ACCESS_KEY
                  optional: true
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: upload-api-secrets
                  key: ACCESS_KEY_ID
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      imagePullSecrets:
        - name: harbor-pull-secret
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: upload-api
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi
